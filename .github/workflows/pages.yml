name: Deploy web build to gh-pages

# Builds the Vite web bundle and publishes it to the `gh-pages` branch.
# GitHub Pages is configured as: Settings -> Pages -> Source: Deploy from a branch
# -> Branch: gh-pages / (root). Each push to main redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build web (Vite)
        run: npm run build:web
        env:
          # Worker URL baked into the bundle. Override via repo variable VITE_BACKEND_URL,
          # or in-app under Settings -> Backend URL.
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://promptforge.paulnercessian.workers.dev' }}

      - name: Publish to gh-pages
        run: |
          cd dist/renderer
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: web build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

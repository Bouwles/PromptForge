<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PromptForge application showcase</title>
  <desc id="desc">A dark PromptForge desktop interface showing project context, a prompt request, generated output, and saved prompt history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#132034"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="72" y="60" width="1136" height="600" rx="18" fill="#0c1220" stroke="#24324a" filter="url(#shadow)"/>
  <rect x="72" y="60" width="1136" height="46" rx="18" fill="#111a2c"/>
  <circle cx="102" cy="83" r="6" fill="#ff6b6b"/>
  <circle cx="124" cy="83" r="6" fill="#fbbf24"/>
  <circle cx="146" cy="83" r="6" fill="#34d399"/>
  <text x="184" y="90" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Prompt<tspan fill="#72a7ff">Forge</tspan></text>
  <text x="1018" y="88" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Ollama connected - qwen2.5-coder</text>

  <rect x="72" y="106" width="206" height="554" fill="#0e1627"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">
    <rect x="94" y="137" width="162" height="38" rx="8" fill="#15233a"/>
    <text x="120" y="162" fill="#f8fafc">Home</text>
    <text x="120" y="213" fill="#a9b7ce">One-Off Prompt</text>
    <text x="120" y="264" fill="#a9b7ce">Projects</text>
    <text x="120" y="315" fill="#a9b7ce">History</text>
    <text x="120" y="366" fill="#a9b7ce">Settings</text>
  </g>

  <g transform="translate(310 132)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850">Project-aware prompt forge</text>
    <text x="0" y="30" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Turn messy coding ideas into copy-paste-ready agent prompts with local context.</text>

    <rect x="0" y="64" width="516" height="136" rx="12" fill="#101827" stroke="#263650"/>
    <text x="22" y="96" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">REQUEST</text>
    <text x="22" y="128" fill="#e7eefb" font-family="Cascadia Code, Consolas, monospace" font-size="15">Improve the battle pass, keep saves stable,</text>
    <text x="22" y="154" fill="#e7eefb" font-family="Cascadia Code, Consolas, monospace" font-size="15">add tests, and do not rewrite the app.</text>
    <rect x="22" y="170" width="132" height="20" rx="10" fill="#17243b"/>
    <text x="36" y="185" fill="#bfd6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Claude Code</text>

    <rect x="0" y="224" width="516" height="280" rx="12" fill="#07101e" stroke="#263650"/>
    <text x="22" y="256" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">GENERATED PROMPT</text>
    <g fill="#dbeafe" font-family="Cascadia Code, Consolas, monospace" font-size="14">
      <text x="22" y="292"># Update RAJIS Battle Pass</text>
      <text x="22" y="328">## Project context</text>
      <text x="22" y="354">React + Three.js + Firebase saves...</text>
      <text x="22" y="390">## Do not break</text>
      <text x="22" y="416">- Keep player inventory and cosmetics intact.</text>
      <text x="22" y="452">## Acceptance criteria</text>
      <text x="22" y="478">- Add focused tests and verify existing flows.</text>
    </g>
    <rect x="22" y="520" width="104" height="34" rx="8" fill="url(#accent)"/>
    <text x="45" y="542" fill="#06101f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Copy</text>
    <rect x="138" y="520" width="116" height="34" rx="8" fill="#15233a" stroke="#304764"/>
    <text x="162" y="542" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Save</text>
  </g>

  <g transform="translate(864 132)">
    <rect x="0" y="0" width="286" height="166" rx="12" fill="#101827" stroke="#263650"/>
    <text x="20" y="34" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Project scan</text>
    <text x="20" y="66" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Framework, tests, routes, DB files</text>
    <rect x="20" y="94" width="76" height="24" rx="12" fill="#18324c"/>
    <text x="38" y="111" fill="#bfe6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">React</text>
    <rect x="106" y="94" width="86" height="24" rx="12" fill="#1a2a44"/>
    <text x="126" y="111" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Vite</text>
    <rect x="20" y="128" width="118" height="24" rx="12" fill="#1c2d46"/>
    <text x="40" y="145" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Firebase</text>

    <rect x="0" y="190" width="286" height="166" rx="12" fill="#101827" stroke="#263650"/>
    <text x="20" y="224" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Local-first</text>
    <text x="20" y="256" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Ollama generation, IndexedDB web mode,</text>
    <text x="20" y="278" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">SQLite desktop history, no login.</text>
    <path d="M24 319h238" stroke="#263650" stroke-width="2"/>
    <circle cx="46" cy="319" r="8" fill="#34d399"/>
    <circle cx="142" cy="319" r="8" fill="#7dd3fc"/>
    <circle cx="238" cy="319" r="8" fill="#4f8cff"/>

    <rect x="0" y="380" width="286" height="124" rx="12" fill="#101827" stroke="#263650"/>
    <text x="20" y="414" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">History library</text>
    <text x="20" y="446" fill="#a9b7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Search, favorite, copy, duplicate, edit.</text>
    <rect x="20" y="472" width="246" height="10" rx="5" fill="#182338"/>
  </g>
</svg>
